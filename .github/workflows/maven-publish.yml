name: MasterPipeline

on:
  push:
    tags: [ 'v*' ]          # 仅打 release 版本号（v*）时自动发布 GitHub Release，提交到 master 不触发
  workflow_dispatch:        # 允许在 Actions 页面手动触发

jobs:
  compile:
    name: 编译（按架构分别打包 sevenzipjbinding）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # amd64/x86_64：sevenzip-all 覆盖大多数平台；同时产出 Windows 包(.zip, 含 LibreOfficePortable)
          # 与 Linux 包(.tar.gz)，故 windows-zip=true
          - arch: amd64
            profile: sevenzip-all
            windows-zip: true
          # arm64：仅 Linux 包(.tar.gz)。不产出 Windows .zip——该 .zip 由 dist-win32.xml 生成、
          # 内含 Windows 专属 LibreOfficePortable(.exe)，在 arm64 上无法使用
          - arch: arm64
            profile: sevenzip-linux-arm64
            windows-zip: false
          # macOS x86_64（Intel）：仅 macOS 包(.tar.gz)。同上，不产出无用的 Windows .zip
          - arch: mac-x86_64
            profile: sevenzip-mac-x86_64
            windows-zip: false
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3. 安装指定 Maven 3.6.3（官方未提供 3.6.3 预装，手动下载）
      - name: Install Maven 3.6.3
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.6.3/binaries/apache-maven-3.6.3-bin.tar.gz
          tar -xzf apache-maven-3.6.3-bin.tar.gz
          sudo mv apache-maven-3.6.3 /opt/
          echo "/opt/apache-maven-3.6.3/bin" >> $GITHUB_PATH

      # 4. 构建（跳过测试，按架构选择 sevenzipjbinding profile）
      - name: Maven Build
        run: mvn -B clean package -Dmaven.test.skip=true -P${{ matrix.profile }}

      # 5. 按架构重命名产物
      - name: Rename tar.gz by arch
        run: |
          mkdir -p dist
          mv server/target/kkFileView-*.tar.gz dist/kkFileView-${{ matrix.arch }}.tar.gz
      # 仅 x86_64 产出 Windows .zip（含 LibreOfficePortable）；arm64/mac 不产出该无用包
      - name: Rename Windows zip by arch
        if: matrix.windows-zip
        run: |
          mv server/target/kkFileView-*.zip dist/kkFileView-${{ matrix.arch }}.zip

      # 6. 把产物上传为 Actions 制品（7 天自动清理）
      # 对应云效的 artifacts.name = BUILD_ARTIFACT（tar.gz 各架构均有；zip 仅 x86_64 有）
      - name: Upload tar.gz Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUILD_ARTIFACT-${{ matrix.arch }}
          path: ./dist/kkFileView-${{ matrix.arch }}.tar.gz
          retention-days: 7
      - name: Upload Windows zip Build Artifact
        if: matrix.windows-zip
        uses: actions/upload-artifact@v4
        with:
          name: BUILD_ARTIFACT-${{ matrix.arch }}-zip
          path: ./dist/kkFileView-${{ matrix.arch }}.zip
          retention-days: 7

  release:
    name: 发布 GitHub Release（v* tag）
    runs-on: ubuntu-latest
    needs: compile
    # 仅在推送 v* tag 时发布 Release，并把各架构产物作为附件
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载所有架构的构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: BUILD_ARTIFACT-*
          merge-multiple: true
          path: artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
